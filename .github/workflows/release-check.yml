name: Release check

# Go modules are published by their tags: the module proxy serves a version
# as soon as someone requests it. This workflow checks that a release tag fits
# the module path (a v3.x.y tag needs the /v3 module path), that the tagged
# code passes the tests, and then asks the proxy for the version so that it
# is cached and listed on pkg.go.dev.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the tag against the module path
        env:
          TAG: ${{ github.ref_name }}
        run: |
          module=$(go list -m)
          major=$(printf '%s' "$TAG" | sed -E 's/^v([0-9]+)\..*/\1/')
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "$TAG is not a semantic version tag (vMAJOR.MINOR.PATCH)." >&2
            exit 1
          fi
          case "$module" in
            */v"$major") ;;
            *) echo "Tag $TAG does not match module path $module; a v$major tag needs the /v$major suffix." >&2; exit 1 ;;
          esac

      - name: Run tests
        run: |
          go vet ./...
          go test -race ./...

      - name: Request the version from the module proxy
        env:
          TAG: ${{ github.ref_name }}
        run: |
          module=$(go list -m)
          for attempt in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m "$module@$TAG"; then
              exit 0
            fi
            sleep 30
          done
          echo "The module proxy did not return $module@$TAG." >&2
          exit 1
